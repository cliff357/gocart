# GitHub Actions CI/CD - 測試工作流程
# 
# Git Flow:
#   feature/* branch → PR to dev → 測試通過才能 merge
#   dev branch → PR to main → 測試通過才能 merge
#   main branch → Production
#
# 觸發條件：
#   - Push 到 main/dev 分支
#   - 所有 Pull Request（到 main 或 dev）

name: CI Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run Firebase Emulator Tests
    runs-on: ubuntu-latest

    steps:
      # 1. 簽出代碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 設置 Java（Firebase Emulator 需要）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. 安裝 npm 依賴
      - name: Install dependencies
        run: npm ci

      # 5. 安裝 Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 6. 運行組件測試（先運行，較快）
      - name: Run Component Tests
        run: npm run test:components

      # 7. 運行 Firebase Emulator 測試
      - name: Run Firebase Emulator Tests
        run: npm run test:emulator

  # 可選：構建檢查
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 如果需要環境變數，在 GitHub Secrets 設置
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'demo-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'demo.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'demo-project' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'demo.appspot.com' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:123456789:web:abc123' }}
